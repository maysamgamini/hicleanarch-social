# The local stack: what the program needs, nothing it does not. Development values only.
#   docker compose up -d
#   dotnet run --project src/Host -- migrate
#   dotnet run --project src/Host
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8.1
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30

  # Neo4j 5.26 Community (GPLv3), run as a server only: the code links only the Apache 2.0 driver.
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: none
    ports: ["7687:7687", "7474:7474"]
