# The local stack: what the program needs, nothing it does not. Development values only.
#   docker compose up -d
#   dotnet run --project src/Host -- migrate
#   dotnet run --project src/Host
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8.1
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 30
