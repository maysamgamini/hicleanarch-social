name: ci

on:
  push:
    branches: [main]
    tags: ["s*-l*"]
  pull_request:

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet build Social.slnx
      - run: dotnet test Social.slnx --no-build
      - name: Every model change has its migration
        run: |
          dotnet tool restore
          for project in $(grep -rl --include='*.csproj' EntityFrameworkCore.Design src/Modules); do
            dotnet ef migrations has-pending-model-changes --project "$project" --no-build
          done

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_wrapper: false
      - name: fmt, validate and test every root, offline
        run: |
          tofu fmt -check -recursive infra
          for dir in infra/bootstrap infra/env; do
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            tofu -chdir="$dir" test
          done
      - name: Apply what Moto implements, then destroy it
        run: ./scripts/moto-apply.sh
