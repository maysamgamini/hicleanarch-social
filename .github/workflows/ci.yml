name: ci

on:
  push:
    branches: [main]
    tags: ["s*-l*"]
  pull_request:

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Pack the BuildingBlocks into the local feed the modules restore from
        run: dotnet pack BuildingBlocks.slnx -c Release -o artifacts/packages
      - name: Build, warnings as errors
        run: dotnet build Social.slnx
      - name: Unit tests
        run: |
          for project in tests/*.UnitTests; do
            dotnet test "$project" --no-build
          done
      - name: Architecture tests
        run: dotnet test tests/Architecture.Tests --no-build
      - name: The openCypher lint
        run: dotnet test tests/Graph.Tests --no-build --filter "FullyQualifiedName~CypherLintTests"
      - name: Graph tests (Neo4j 5.26 in Testcontainers; the Neptune run is skipped without NEPTUNE_ENDPOINT)
        run: dotnet test tests/Graph.Tests --no-build
      - name: Integration and rule tests (PostgreSQL 17, Valkey 8, Neo4j 5.26 in Testcontainers)
        run: dotnet test tests/Integration.Tests --no-build
      - name: Every model change has its migration
        run: |
          dotnet tool restore
          for project in $(grep -rl --include='*.csproj' EntityFrameworkCore.Design src/Modules); do
            dotnet ef migrations has-pending-model-changes --project "$project" --no-build
          done
      - name: The images build
        run: |
          docker build -q -t social-api:ci .
          docker build -q -t social-gateway:ci -f src/Gateway/Dockerfile .

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: fmt, validate and test every root, offline
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/env; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done
      - name: Apply what Moto implements, then destroy it
        run: ./scripts/moto-apply.sh
